      <rect x="1100" y="2" width="80" height="10" rx="2"/>
    </g>
    <rect x="1240" y="-6" width="120" height="28" rx="14" fill="#116466"/>
  </g>

  <!-- Hero band -->
  <g transform="translate(150, 230)">
    <rect x="0" y="0"  width="120" height="16" rx="4" fill="#2bbfb8" fill-opacity="0.55"/>
    <rect x="0" y="40" width="780" height="40" rx="6" fill="#ecf2ef" fill-opacity="0.92"/>
    <rect x="0" y="92" width="600" height="40" rx="6" fill="#ecf2ef" fill-opacity="0.92"/>
    <rect x="0" y="160" width="520" height="14" rx="4" fill="#ecf2ef" fill-opacity="0.45"/>
    <rect x="0" y="184" width="440" height="14" rx="4" fill="#ecf2ef" fill-opacity="0.45"/>
    <rect x="0" y="240" width="160" height="44" rx="22" fill="#116466"/>
    <rect x="180" y="240" width="160" height="44" rx="22" fill="none" stroke="#ecf2ef" stroke-opacity="0.18"/>
    <!-- Right-side product mock -->
    <g transform="translate(880, 0)" fill="#ecf2ef" fill-opacity="0.04" stroke="#ecf2ef" stroke-opacity="0.1">
