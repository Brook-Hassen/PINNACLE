      <rect x="22"  y="92" width="280" height="8" rx="2"/>
      <rect x="462" y="76" width="320" height="8" rx="2"/>
      <rect x="462" y="92" width="240" height="8" rx="2"/>
      <rect x="902" y="76" width="320" height="8" rx="2"/>
