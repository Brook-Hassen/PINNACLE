      <rect x="20" y="60"  width="90"  height="6"  rx="2"/>
    </g>
    <g transform="translate(880, 0)" fill="#ecf2ef" fill-opacity="0.18">
      <rect x="20"  y="120" width="160" height="80" rx="8"/>
      <rect x="200" y="120" width="160" height="80" rx="8"/>
      <rect x="20"  y="210" width="340" height="40" rx="8"/>
    </g>
  </g>

  <!-- Feature row 3-col -->
  <g transform="translate(150, 600)" fill="#ecf2ef" fill-opacity="0.04" stroke="#ecf2ef" stroke-opacity="0.08">
    <rect x="0"   y="0" width="420" height="160" rx="14"/>
    <rect x="440" y="0" width="420" height="160" rx="14"/>
    <rect x="880" y="0" width="420" height="160" rx="14"/>
  </g>
  <g transform="translate(150, 600)">
    <g fill="#2bbfb8" fill-opacity="0.7">
