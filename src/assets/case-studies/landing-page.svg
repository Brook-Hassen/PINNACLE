<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#04080a"/>

  <!-- Browser chrome -->
  <rect x="80" y="60" width="1440" height="780" rx="18" fill="#ecf2ef" fill-opacity="0.02" stroke="#ecf2ef" stroke-opacity="0.1"/>
  <g transform="translate(110, 90)">
    <circle cx="10" cy="10" r="6" fill="#ecf2ef" fill-opacity="0.18"/>
