  <rect x="220" y="84" width="600" height="22" rx="11" fill="#ecf2ef" fill-opacity="0.05"/>
  <text x="240" y="100" fill="#ecf2ef" fill-opacity="0.42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">lattice.so</text>

  <!-- Site navbar -->
  <line x1="100" y1="140" x2="1500" y2="140" stroke="#ecf2ef" stroke-opacity="0.08"/>
