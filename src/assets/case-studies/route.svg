<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#04080a"/>

  <text x="100" y="50" fill="#2bbfb8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">ROUTE PLANNER · EDGE</text>

  <!-- Map area -->
  <rect x="80" y="90" width="1080" height="750" rx="14" fill="#ecf2ef" fill-opacity="0.02" stroke="#ecf2ef" stroke-opacity="0.08"/>

  <!-- Map grid -->
  <g stroke="#ecf2ef" stroke-opacity="0.05">
    <line x1="180" y1="90" x2="180" y2="840"/>
    <line x1="280" y1="90" x2="280" y2="840"/>
    <line x1="380" y1="90" x2="380" y2="840"/>
    <line x1="480" y1="90" x2="480" y2="840"/>
    <line x1="580" y1="90" x2="580" y2="840"/>
    <line x1="680" y1="90" x2="680" y2="840"/>
    <line x1="780" y1="90" x2="780" y2="840"/>
    <line x1="880" y1="90" x2="880" y2="840"/>
    <line x1="980" y1="90" x2="980" y2="840"/>
    <line x1="1080" y1="90" x2="1080" y2="840"/>
    <line x1="80" y1="190" x2="1160" y2="190"/>
    <line x1="80" y1="290" x2="1160" y2="290"/>
    <line x1="80" y1="390" x2="1160" y2="390"/>
    <line x1="80" y1="490" x2="1160" y2="490"/>
    <line x1="80" y1="590" x2="1160" y2="590"/>
    <line x1="80" y1="690" x2="1160" y2="690"/>
    <line x1="80" y1="790" x2="1160" y2="790"/>
  </g>

  <!-- Roads -->
  <g stroke="#ecf2ef" stroke-opacity="0.14" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 80 230 Q 320 200 540 280 T 980 360 T 1160 420"/>
    <path d="M 200 90 L 240 460 L 480 620 L 720 540 L 880 720 L 1100 840"/>
    <path d="M 80 620 Q 280 580 460 700 T 820 760 T 1160 720"/>
  </g>

  <!-- Active route (teal, animated-looking with dashed) -->
  <path d="M 220 750 L 320 600 L 480 540 L 620 420 L 780 360 L 920 280 L 1020 200" fill="none" stroke="#2bbfb8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 220 750 L 320 600 L 480 540 L 620 420 L 780 360 L 920 280 L 1020 200" fill="none" stroke="#58e0d2" stroke-width="3" stroke-dasharray="3,8" stroke-linecap="round" opacity="0.6"/>

  <!-- Stops -->
  <g fill="#04080a" stroke="#2bbfb8" stroke-width="2.5">
    <circle cx="220" cy="750" r="9"/>
    <circle cx="480" cy="540" r="9"/>
    <circle cx="780" cy="360" r="9"/>
    <circle cx="1020" cy="200" r="9"/>
  </g>
  <g fill="#2bbfb8">
    <circle cx="220" cy="750" r="3"/>
    <circle cx="480" cy="540" r="3"/>
    <circle cx="780" cy="360" r="3"/>
    <circle cx="1020" cy="200" r="3"/>
  </g>

  <!-- Distant pins -->
  <g>
    <circle cx="380" cy="240" r="5" fill="#ecf2ef" fill-opacity="0.35"/>
    <circle cx="640" cy="700" r="5" fill="#ecf2ef" fill-opacity="0.35"/>
    <circle cx="900" cy="620" r="5" fill="#ecf2ef" fill-opacity="0.35"/>
    <circle cx="1080" cy="500" r="5" fill="#ecf2ef" fill-opacity="0.35"/>
  </g>

  <!-- Right panel: route list -->
  <rect x="1180" y="90" width="340" height="750" rx="14" fill="#ecf2ef" fill-opacity="0.03" stroke="#ecf2ef" stroke-opacity="0.08"/>
  <g transform="translate(1200, 120)">
    <rect x="0" y="0" width="160" height="14" rx="3" fill="#ecf2ef" fill-opacity="0.85"/>
    <rect x="0" y="22" width="100" height="8" rx="2" fill="#ecf2ef" fill-opacity="0.45"/>
  </g>
  <g transform="translate(1200, 180)">
    <g fill="#ecf2ef" fill-opacity="0.05" stroke="#ecf2ef" stroke-opacity="0.08">
      <rect x="0" y="0"   width="300" height="80" rx="10"/>
      <rect x="0" y="92"  width="300" height="80" rx="10"/>
      <rect x="0" y="184" width="300" height="80" rx="10"/>
      <rect x="0" y="276" width="300" height="80" rx="10"/>
    </g>
    <!-- highlight active -->
    <rect x="0" y="0" width="300" height="80" rx="10" fill="rgba(43,191,184,0.1)" stroke="#2bbfb8" stroke-opacity="0.45"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
      <text x="18" y="26" fill="#2bbfb8">ROUTE A · LIVE</text>
      <text x="18" y="118" fill="#ecf2ef" fill-opacity="0.62">ROUTE B · 14 MIN</text>
      <text x="18" y="210" fill="#ecf2ef" fill-opacity="0.62">ROUTE C · 22 MIN</text>
      <text x="18" y="302" fill="#ecf2ef" fill-opacity="0.62">ROUTE D · 28 MIN</text>
    </g>
    <g fill="#ecf2ef" fill-opacity="0.32">
      <rect x="18" y="40"  width="120" height="6" rx="2"/>
      <rect x="18" y="54"  width="80"  height="6" rx="2"/>
      <rect x="18" y="132" width="140" height="6" rx="2"/>
      <rect x="18" y="146" width="90"  height="6" rx="2"/>
      <rect x="18" y="224" width="100" height="6" rx="2"/>
      <rect x="18" y="238" width="70"  height="6" rx="2"/>
      <rect x="18" y="316" width="120" height="6" rx="2"/>
      <rect x="18" y="330" width="80"  height="6" rx="2"/>
    </g>
  </g>

  <g transform="translate(1200, 600)">
    <rect x="0" y="0" width="80" height="10" rx="2" fill="#2bbfb8" fill-opacity="0.7"/>
    <rect x="0" y="20" width="300" height="6" rx="2" fill="#ecf2ef" fill-opacity="0.18"/>
    <rect x="0" y="20" width="220" height="6" rx="2" fill="#2bbfb8" fill-opacity="0.85"/>
    <text x="0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" font-weight="600" fill="#ecf2ef" fill-opacity="0.92">14:42</text>
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2" fill="#ecf2ef" fill-opacity="0.5">ESTIMATED ARRIVAL</text>
  </g>
</svg>
