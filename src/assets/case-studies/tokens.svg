<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#04080a"/>

  <text x="100" y="80" fill="#2bbfb8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">DESIGN TOKENS · v1.4</text>

  <!-- Color swatches row -->
  <text x="100" y="160" fill="#ecf2ef" fill-opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">COLOR · TEAL SCALE</text>
  <g transform="translate(100, 180)">
    <rect x="0"   y="0" width="180" height="140" rx="14" fill="#0a1f20"/>
    <rect x="200" y="0" width="180" height="140" rx="14" fill="#134f51"/>
    <rect x="400" y="0" width="180" height="140" rx="14" fill="#116466"/>
    <rect x="600" y="0" width="180" height="140" rx="14" fill="#1a8d90"/>
    <rect x="800" y="0" width="180" height="140" rx="14" fill="#2bbfb8"/>
    <rect x="1000" y="0" width="180" height="140" rx="14" fill="#58e0d2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ecf2ef" fill-opacity="0.5" letter-spacing="1">
      <text x="14" y="160">04080A</text>
      <text x="214" y="160">134F51</text>
      <text x="414" y="160">116466</text>
      <text x="614" y="160">1A8D90</text>
      <text x="814" y="160">2BBFB8</text>
      <text x="1014" y="160">58E0D2</text>
    </g>
  </g>

  <!-- Type scale -->
  <text x="100" y="410" fill="#ecf2ef" fill-opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">TYPE · SCALE</text>
  <g transform="translate(100, 430)">
    <rect x="0" y="0"   width="380" height="64" fill="#ecf2ef" fill-opacity="0.92"/>
    <rect x="0" y="80"  width="320" height="44" fill="#ecf2ef" fill-opacity="0.78"/>
    <rect x="0" y="140" width="260" height="30" fill="#ecf2ef" fill-opacity="0.62"/>
    <rect x="0" y="190" width="200" height="20" fill="#ecf2ef" fill-opacity="0.46"/>
    <rect x="0" y="230" width="140" height="14" fill="#ecf2ef" fill-opacity="0.3"/>
  </g>

  <!-- Spacing scale -->
  <text x="640" y="410" fill="#ecf2ef" fill-opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">SPACE · 4PT GRID</text>
  <g transform="translate(640, 430)" stroke="#2bbfb8" stroke-opacity="0.6" stroke-width="2" fill="none">
    <line x1="0" y1="20"  x2="32" y2="20"/>
    <line x1="0" y1="60"  x2="64" y2="60"/>
    <line x1="0" y1="100" x2="96" y2="100"/>
    <line x1="0" y1="140" x2="128" y2="140"/>
    <line x1="0" y1="180" x2="192" y2="180"/>
    <line x1="0" y1="220" x2="256" y2="220"/>
  </g>
  <g transform="translate(640, 430)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ecf2ef" fill-opacity="0.5">
    <text x="280" y="24">04</text>
    <text x="280" y="64">08</text>
    <text x="280" y="104">12</text>
    <text x="280" y="144">16</text>
    <text x="280" y="184">24</text>
    <text x="280" y="224">32</text>
  </g>

  <!-- Radius row -->
  <text x="1080" y="410" fill="#ecf2ef" fill-opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">RADIUS · STEP</text>
  <g transform="translate(1080, 430)" stroke="#ecf2ef" stroke-opacity="0.18" fill="#04080a">
    <rect x="0"   y="0" width="80" height="80" rx="6"/>
    <rect x="100" y="0" width="80" height="80" rx="14"/>
    <rect x="200" y="0" width="80" height="80" rx="22"/>
    <rect x="300" y="0" width="80" height="80" rx="40"/>
  </g>

  <line x1="100" y1="820" x2="1500" y2="820" stroke="#2bbfb8" stroke-opacity="0.5" stroke-width="1"/>
  <text x="100" y="860" fill="#ecf2ef" fill-opacity="0.42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">STYLE DICTIONARY → TAILWIND · SWIFT · WEB DOCS</text>
